<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Planner</title>
<link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" href="slogo.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .planner {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input[type="text"],
        input[type="datetime-local"] {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #28a745;
            color: #fff;
            cursor: pointer;
        }

        #button:hover {
            background-color: #218838;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        .delete-btn {
            background-color: #dc3545;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 5px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
<div class="head">
        <pre> </pre><img id="mlogo" src="..\nlogo.png" height="60" width="60" alt="School Logo"> <pre> </pre>
        <a href="..\index.html"><button>Home</button></a> <pre>      </pre>
        <a href="..\daily_routine.html"><button>Daily Routine</button></a> <pre>      </pre>
        <a href="..\e_books.html"><button>E-Books</button></a> <pre>      </pre>
        <a href="..\Tools.html"><button>Tools</button></a> <pre>      </pre>
    </div>
    <div class="planner">
        <h1>Homework Planner</h1>
        <form id="homeworkForm">
            <input type="text" id="homeworkInput" placeholder="Enter your homework" required>
            <input type="datetime-local" id="dueDate" required>
            <button id="Button" type="submit">Add Homework</button>
        </form>
        <ul id="homeworkList"></ul>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const homeworkForm = document.getElementById('homeworkForm');
            const homeworkInput = document.getElementById('homeworkInput');
            const dueDateInput = document.getElementById('dueDate');
            const homeworkList = document.getElementById('homeworkList');

            homeworkForm.addEventListener('submit', addHomework);
            homeworkList.addEventListener('click', removeHomework);

            loadHomeworks();

            function addHomework(event) {
                event.preventDefault();

                const homeworkText = homeworkInput.value;
                const dueDate = dueDateInput.value;

                if (homeworkText && dueDate) {
                    const homework = {
                        id: Date.now(),
                        text: homeworkText,
                        dueDate: dueDate
                    };

                    const homeworkItem = createHomeworkItem(homework);
                    homeworkList.appendChild(homeworkItem);

                    saveHomework(homework);
                    scheduleNotification(homework);

                    homeworkInput.value = '';
                    dueDateInput.value = '';
                }
            }

            function removeHomework(event) {
                if (event.target.classList.contains('delete-btn')) {
                    const homeworkItem = event.target.closest('li');
                    const homeworkId = homeworkItem.dataset.id;

                    homeworkItem.remove();
                    deleteHomework(homeworkId);
                }
            }

            function createHomeworkItem(homework) {
                const li = document.createElement('li');
                li.dataset.id = homework.id;

                const textSpan = document.createElement('span');
                textSpan.textContent = `${homework.text} - Due: ${new Date(homework.dueDate).toLocaleString()}`;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.classList.add('delete-btn');

                li.appendChild(textSpan);
                li.appendChild(deleteBtn);

                return li;
            }

            function saveHomework(homework) {
                const homeworks = getHomeworks();
                homeworks.push(homework);
                localStorage.setItem('homeworks', JSON.stringify(homeworks));
            }

            function deleteHomework(id) {
                let homeworks = getHomeworks();
                homeworks = homeworks.filter(homework => homework.id != id);
                localStorage.setItem('homeworks', JSON.stringify(homeworks));
            }

            function getHomeworks() {
                return JSON.parse(localStorage.getItem('homeworks')) || [];
            }

            function loadHomeworks() {
                const homeworks = getHomeworks();
                homeworks.forEach(homework => {
                    const homeworkItem = createHomeworkItem(homework);
                    homeworkList.appendChild(homeworkItem);
                });
            }

            function scheduleNotification(homework) {
                const now = new Date().getTime();
                const dueDate = new Date(homework.dueDate).getTime();
                const timeUntilDue = dueDate - now;

                if (timeUntilDue > 0) {
                    setTimeout(() => {
                        showNotification(`Reminder: Your homework "${homework.text}" is due now!`);
                    }, timeUntilDue);
                }
            }

            function showNotification(message) {
                if (Notification.permission === 'granted') {
                    new Notification(message);
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            new Notification(message);
                        }
                    });
                }
            }

            if (Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        });
    </script>
</body>
</html>
