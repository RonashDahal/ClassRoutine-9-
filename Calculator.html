<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 9 Routine | Computer Engineering</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" href="slogo.png">
    <style>

        .calculator-container {
            margin-top: 80px; /* Adjust this value to move the calculator further down */
        }

        .calculator {
            background-color: #cc9;
            border: 1px solid ;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px; /* Fixed width */
            margin: auto; /* Center the calculator */
        }

        .display {
            background-color: #222;
            color: #fff;
            font-size: 2em;
            padding: 4px;
            text-align: right;
            height: 50px; /* Fixed height */
            box-sizing: border-box;
            overflow: hidden;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
        }

        .btn {
            color: black;
            padding: 15px;
            font-size: 1.5em;
            background-color: #fff;
            border: 1px solid #ccc; /* Added border */
            border-radius:50%;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #f0f0f0;
        }

        .btn:active {
            background-color: #ddd;
        }
    </style>
</head>
<body onload="repet()">
    <div class="head">
        <pre> </pre><img id="mlogo" src="..\nlogo.png" height="60" width="60" alt="School Logo"> <pre> </pre>
        <a href="..\index.html"><button>Home</button></a> <pre>      </pre>
        <a href="..\daily_routine.html"><button>Daily Routine</button></a> <pre>      </pre>
        <a href="..\e_books.html"><button>E-Books</button></a> <pre>      </pre>
        <a href="..\Tools.html"><button>Tools</button></a> <pre>      </pre>
    </div>
    <div class="calculator-container"><h3>Calcualtor</h3>
        <div class="calculator">
            <div class="display" id="display">0</div> <!-- Set initial value to "0" -->
            <div class="buttons">
                <button class="btn" onclick="clearDisplay()">C</button>
                <button class="btn" onclick="appendCharacter('7')">7</button>
                <button class="btn" onclick="appendCharacter('8')">8</button>
                <button class="btn" onclick="appendCharacter('9')">9</button>
                <button class="btn" onclick="appendCharacter('/')">/</button>
                <button class="btn" onclick="appendCharacter('4')">4</button>
                <button class="btn" onclick="appendCharacter('5')">5</button>
                <button class="btn" onclick="appendCharacter('6')">6</button>
                <button class="btn" onclick="appendCharacter('*')">*</button>
                <button class="btn" onclick="appendCharacter('1')">1</button>
                <button class="btn" onclick="appendCharacter('2')">2</button>
                <button class="btn" onclick="appendCharacter('3')">3</button>
                <button class="btn" onclick="appendCharacter('-')">-</button>
                <button class="btn" onclick="appendCharacter('0')">0</button>
                <button class="btn" onclick="appendCharacter('.')">.</button>
                <button class="btn" onclick="calculateResult()">=</button>
                <button class="btn" onclick="appendCharacter('+')">+</button>
            </div>
        </div>
    </div>
    <script>
        function appendCharacter(character) {
            const display = document.getElementById('display');
            if (display.textContent === "0") {
                display.textContent = character;
            } else {
                display.textContent += character;
            }
        }

        function clearDisplay() {
            const display = document.getElementById('display');
            display.textContent = '0'; // Reset to "0"
        }

        function calculateResult() {
            const display = document.getElementById('display');
            try {
                display.textContent = eval(display.textContent);
            } catch {
                display.textContent = 'Error';
            }
        }
    </script>
</body>
</html>
